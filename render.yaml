services:
  - type: web
    name: portal-galeria-programas
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.6
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        value: arquivos2026
      - key: SECRET_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PROGRAMS_PASSWORD
        sync: false
